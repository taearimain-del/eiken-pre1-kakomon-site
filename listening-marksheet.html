<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>英検準1級 マークシート（リスニング）</title>
<link rel="stylesheet" href="common/marksheet.css">
</head>
<body>
<div class="wrap">
  <div class="hd">
    <a class="back" href="index.html">&larr; 音声プレイヤーに戻る</a>
    <h1>英検準1級　リスニング マークシート</h1>
    <div class="meta">Part1 会話の内容一致選択(12問)／Part2 文の内容一致選択(12問)／Part3 Real-Life形式の内容一致選択(5問)　全29問・4択・1回読み</div>
  </div>
  <div class="round-select" id="roundSelect"></div>
  <div class="player-fixed">
    <audio id="player" controls></audio>
    <select id="speedSel">
      <option value="0.75">0.75x</option>
      <option value="1" selected>1.0x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
    </select>
  </div>
  <div id="sheet"></div>
  <div class="hint">再生ボタンで該当音声を再生 → 選択肢をクリックしてマーク → 下の「正答」欄に公式解答をカンマ区切りで入力して採点。</div>
</div>
<script src="tracks.js"></script>
<script src="common/listening-engine.js"></script>
<script>
  var PARTS = [
    { prefix: 'Part1', label: 'Part1 会話の内容一致選択', note: '12問・4択' },
    { prefix: 'Part2', label: 'Part2 文の内容一致選択', note: '12問・4択' },
    { prefix: 'Part3', label: 'Part3 Real-Life形式の内容一致選択', note: '5問・4択' }
  ];

  var ROUNDS = Object.keys(window.TRACKS_DATA || {});
  var roundSelectEl = document.getElementById('roundSelect');
  var sheetEl = document.getElementById('sheet');
  var audioEl = document.getElementById('player');
  var speedSel = document.getElementById('speedSel');
  var LAST_KEY = 'ek-p1-listening-lastround';

  speedSel.addEventListener('change', function () {
    audioEl.playbackRate = parseFloat(speedSel.value);
  });

  function pickRound(key) {
    Array.prototype.forEach.call(roundSelectEl.children, function (b) {
      b.classList.toggle('active', b.dataset.key === key);
    });
    localStorage.setItem(LAST_KEY, key);
    var round = window.TRACKS_DATA[key];
    var listeningSec = round.sections.filter(function (s) { return s.key === 'listening'; })[0];
    EikenListening.render(sheetEl, audioEl, {
      storageKey: 'ek-p1-listening-' + key,
      tracks: listeningSec.tracks,
      parts: PARTS
    });
  }

  ROUNDS.forEach(function (key) {
    var r = window.TRACKS_DATA[key];
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = r.label;
    b.dataset.key = key;
    b.addEventListener('click', function () { pickRound(key); });
    roundSelectEl.appendChild(b);
  });

  var last = localStorage.getItem(LAST_KEY);
  pickRound(ROUNDS.indexOf(last) !== -1 ? last : ROUNDS[0]);
</script>
</body>
</html>
